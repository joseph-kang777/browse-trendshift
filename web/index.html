<!doctype html>
<html lang="ko" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trendshift Finder</title>
    <meta name="description" content="Find GitHub repositories that trended on trendshift.io with natural-language search over their descriptions and READMEs (English, Korean and more)." />
    <!-- Link previews (Open Graph / Twitter); crawlers need absolute URLs -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Trendshift Finder" />
    <meta property="og:title" content="Trendshift Finder" />
    <meta property="og:description" content="Describe what you need and find matching trending GitHub repositories from trendshift.io, searched by description and README." />
    <meta property="og:url" content="https://browse-trendshift.vercel.app/" />
    <meta property="og:image" content="https://browse-trendshift.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html { background: oklch(0.925 0.007 265); }
      html.dark { background: oklch(0.16 0 0); color-scheme: dark; }
    </style>
    <script>
      // Before first paint: saved theme, otherwise dark (Solid Glass's material as designed).
      (function () {
        var saved = null
        try { saved = localStorage.getItem("tf:theme") } catch (e) {}
        document.documentElement.classList.toggle("dark", saved !== "light")
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
