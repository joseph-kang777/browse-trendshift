# Daily: new trendshift days -> READMEs of new repos -> incremental index -> deploy to Vercel.
#
# data/ (daily rankings, READMEs, full index) lives in the Actions cache, not in git.
# The first run has no vectors cached: it restores the locally built ones from the
# draft release "index-seed" if present (backend "local", a full CPU embed on the runner,
# does not finish within the 6 h job limit). Runs embed only new text, on Cloudflare Workers AI.
#
# Secrets: CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN, VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
name: Daily update

on:
  schedule:
    - cron: "0 1 * * *" # 10:00 KST; trendshift days are UTC
  workflow_dispatch:
    inputs:
      backend:
        description: "Embedding backend (local = bge-m3 on the runner CPU, for the first full build)"
        type: choice
        options: [cloudflare, local]
        default: cloudflare

concurrency: daily-update

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write # read the draft "index-seed" release (drafts need push access)
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0

      - name: Restore data
        uses: actions/cache/restore@v6
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: data-

      # No cached vectors yet: start from the ones built locally (draft release "index-seed",
      # same model and text keys) so only text that differs is embedded.
      - name: Seed vectors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f data/index/keys.json ] && gh release view index-seed >/dev/null 2>&1; then
            mkdir -p data/index
            gh release download index-seed -p index-seed.tar.gz -O - | tar -xz -C data/index
            echo "seeded $(ls data/index)"
          fi

      - name: Update data and index
        env:
          EMBED_BACKEND: ${{ inputs.backend || 'cloudflare' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$EMBED_BACKEND" = local ]; then
            uv sync
            uv run update.py
          else
            uv run --no-project --with requests --with numpy python update.py
          fi

      - name: Save data
        if: always() # keep progress (e.g. scraped days) even if a later step failed
        uses: actions/cache/save@v6
        with:
          path: data
          key: data-${{ github.run_id }}

      - name: Export deploy index
        run: uv run --no-project --with numpy python export_index.py

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx --yes vercel@64.7.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@64.7.0 build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@64.7.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
